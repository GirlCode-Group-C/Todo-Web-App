{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Todo Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; padding: 1rem; }
        #calendar { width: 70%;  margin-right: 2%; }
        .sidebar-container { width: 28%; height: 70%; background: #f8f9fa; padding: 1rem; border-radius: 8px; }
        h3, h4 { margin-top: 1rem; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 0.25rem 0; }
        .todo-list {
            margin: 1rem 0;
        }
        .todo-card {
            background: #ffffff;
            border-radius: 6px;
            padding: 0.7rem 1rem;
            margin: 0.5rem 0;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .todo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .todo-card p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        #todoModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #todoModal .modal-card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 400px;
            max-width: 90%;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }
        #todoModal button#closeModal {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff5c5c;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #todoModal h3 {
            margin: 0;
            font-size: 1.4rem;
            text-align: center;
            color: #333;
        }
        #todoModal label {
            font-weight: 600;
            color: #555;
        }
        #todoModal input,
        #todoModal select,
        #todoModal textarea {
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 100%;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        #todoModal input:focus,
        #todoModal select:focus,
        #todoModal textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }
        input[readonly],
        textarea[readonly],
        select:disabled {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 0.5rem;
        }
        #todoModal button#saveTodo {
            background: #007bff;
            color: white;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }
        #todoModal button#saveTodo:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
        #viewTodoModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #viewTodoModal .modal {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 450px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        #viewTodoModal .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff5c5c;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #viewTodoModal h3 {
            margin: 0;
            text-align: center;
            color: #333;
            font-size: 1.5rem;
        }
        #viewTodoModal label {
            font-weight: 600;
            color: #555;
        }
        #viewTodoModal input,
        #viewTodoModal select,
        #viewTodoModal textarea {
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 90%;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        #viewTodoModal input:focus,
        #viewTodoModal select:focus,
        #viewTodoModal textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }
        #viewTodoModal .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        #viewTodoModal .edit-btn {
            background: #ffc107;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        #viewTodoModal .edit-btn:hover {
            background: #e0a800;
        }
        #viewTodoModal .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        #viewTodoModal .delete-btn:hover {
            background: #b02a37;
        }
        #viewTodoModal .save-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        #viewTodoModal .save-btn:hover {
            background: #218838;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="calendar"></div>

    <aside id="sidebar-container" class="sidebar-container">
        {% include 'partials/sidebar.html' %}
    </aside>
    <!-- Modal Popup -->
    <div id="todoModal">
        <div class="modal-card">
            <button id="closeModal">X</button>
            <h3>Create New Todo</h3>
            <label>Type:</label>
            <select id="todoType">
                {% for t in todo_types %}
                <option value="{{ t.id }}">{{ t.name }}</option>
                {% endfor %}
            </select>
            <input type="text" id="todoTitle" placeholder="Title">
            <textarea id="todoDesc" placeholder="Description"></textarea>
            <button id="saveTodo">Save</button>
        </div>
    </div>
   <!-- View Todo Modal -->
    <div id="viewTodoModal" class="modal-overlay">
        <div class="modal">
            <button id="closeViewModal" class="close-btn">X</button>
            <h3>Todo Details</h3>

            <label>Title:</label>
            <input type="text" id="viewTodoTitle" readonly>

            <label>Description:</label>
            <textarea id="viewTodoDesc" readonly></textarea>

            <div class="form-row">
                <div class="form-group">
                    <label>Due Date:</label>
                    <input type="date" id="viewTodoDueDate" readonly>
                </div>
                <div class="form-group">
                    <label>Type:</label>
                    <select id="viewTodoType" disabled>
                        {% for t in todo_types %}
                            <option value="{{ t.id }}">{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="modal-actions">
                <button id="editTodoBtn" class="edit-btn">Edit</button>
                <button id="deleteTodoBtn" class="delete-btn">Delete</button>
                <button id="saveTodoBtn" class="save-btn" style="display:none;">Save</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

        // ----------------------
        // Calendar Setup
        // ----------------------
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            height: '600px',
            initialView: 'dayGridMonth',
            events: '/get-todos-json/',
            dateClick: info => openAddTodoModal(info.dateStr),
           eventClick: function(info) {
                info.jsEvent.preventDefault();
                const todoId = info.event.id;

                fetch(`/get-todo-json/${todoId}/`)
                    .then(res => res.json())
                    .then(todo => {
                        openViewTodoModal(todo);
                    })
                    .catch(err => console.error('Failed to load todo details:', err));
            }


        });
        calendar.render();

        // ----------------------
        // Sidebar Refresh
        // ----------------------
        function refreshSidebar() {
            fetch('/sidebar-partial/')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('sidebar-container').innerHTML = data.html;
                    rebindTodoCardClickHandlers();
                })
                .catch(err => console.error('Sidebar refresh failed', err));
        }

        // ----------------------
        // Modal Helpers
        // ----------------------
        const addModal = document.getElementById('todoModal');
        const viewModal = document.getElementById('viewTodoModal');

        function openAddTodoModal(dateStr) {
            addModal.style.display = 'flex';
            const saveBtn = document.getElementById('saveTodo');
            saveBtn.onclick = null; // remove old handler

            saveBtn.onclick = function() {
                fetch('/add-todo-from-calendar/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        title: document.getElementById('todoTitle').value,
                        description: document.getElementById('todoDesc').value,
                        todo_type: document.getElementById('todoType').value,
                        due_date: dateStr
                    })
                })
                .then(res => res.json())
                .then(() => {
                    addModal.style.display = 'none';
                    calendar.refetchEvents();
                    refreshSidebar();
                })
                .catch(err => console.error(err));
            };
        }

        document.getElementById('closeModal').onclick = () => addModal.style.display = 'none';

        // ----------------------
        // View/Edit/Delete Modal
        // ----------------------
        let currentTodoId = null;

        function openViewTodoModal(todo) {
            currentTodoId = todo.id;

            document.getElementById('viewTodoTitle').value = todo.title;
            document.getElementById('viewTodoDesc').value = todo.description;
            document.getElementById('viewTodoDueDate').value = todo.due_date;
            document.getElementById('viewTodoType').value = todo.todo_type;

            setViewFieldsReadonly(true);
            document.getElementById('saveTodoBtn').style.display = 'none';
            document.getElementById('editTodoBtn').style.display = 'inline-block';

            document.getElementById('viewTodoModal').style.display = 'flex';
        }

        document.getElementById('closeViewModal').onclick = () => viewModal.style.display = 'none';

        document.getElementById('editTodoBtn').onclick = () => {
            setViewFieldsReadonly(false);
            document.getElementById('saveTodoBtn').style.display = 'inline-block';
            document.getElementById('editTodoBtn').style.display = 'none';
        };

        document.getElementById('saveTodoBtn').onclick = () => {
            const payload = {
                title: document.getElementById('viewTodoTitle').value,
                description: document.getElementById('viewTodoDesc').value,
                due_date: document.getElementById('viewTodoDueDate').value,
                todo_type: document.getElementById('viewTodoType').value
            };
            fetch(`/update-todo/${currentTodoId}/`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(payload)
            }).then(() => {
                viewModal.style.display = 'none';
                calendar.refetchEvents();
                refreshSidebar();
            });
        };

        document.getElementById('deleteTodoBtn').onclick = () => {
            if (!confirm('Are you sure you want to delete this todo?')) return;
            fetch(`/delete-todo/${currentTodoId}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            }).then(() => {
                viewModal.style.display = 'none';
                calendar.refetchEvents();
                refreshSidebar();
            });
        };

        function setViewFieldsReadonly(readonly) {
            document.getElementById('viewTodoTitle').readOnly = readonly;
            document.getElementById('viewTodoDesc').readOnly = readonly;
            document.getElementById('viewTodoDueDate').readOnly = readonly;
            document.getElementById('viewTodoType').disabled = readonly;
        }

        // ----------------------
        // Sidebar Todo Cards
        // ----------------------
        document.querySelectorAll('.todo-card').forEach(card => {
            card.addEventListener('mousedown', e => e.preventDefault());
        });

        function rebindTodoCardClickHandlers() {
            document.querySelectorAll('.todo-card').forEach(card => {
                card.onclick = () => {
                if(!card.dataset.id) return
                    const todo = {
                        id: card.dataset.id,
                        title: card.dataset.title,
                        description: card.dataset.desc,
                        due_date: card.dataset.date,
                        todo_type: card.dataset.type
                    };
                    openViewTodoModal(todo);
                };
            });
        }

        // Initial binding
        rebindTodoCardClickHandlers();

        // Optional: close modals on clicking outside
        [addModal, viewModal].forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });

    });
    </script>
</body>
</html>
