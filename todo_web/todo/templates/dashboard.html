{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Todo Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'todo/dashboard.css' %}">
</head>
<body>
    <div id="calendar"></div>

    <aside id="sidebar-container" class="sidebar-container">
        {% include 'partials/sidebar.html' %}
    </aside>
    <!-- Modal Popup -->
    <div id="todoModal">
        <div class="modal-card">
            <button id="closeModal">X</button>
            <h3>Create New Todo</h3>
            <label>Type:</label>
            <select id="todoType">
                {% for t in todo_types %}
                <option value="{{ t.id }}">{{ t.name }}</option>
                {% endfor %}
            </select>
            <input type="text" id="todoTitle" placeholder="Title">
            <textarea id="todoDesc" placeholder="Description"></textarea>
            <button id="saveTodo">Save</button>
        </div>
    </div>
   <!-- View Todo Modal -->
    <div id="viewTodoModal" class="modal-overlay">
        <div class="modal">
            <button id="closeViewModal" class="close-btn">X</button>
            <h3>Todo Details</h3>

            <label>Title:</label>
            <input type="text" id="viewTodoTitle" readonly>

            <label>Description:</label>
            <textarea id="viewTodoDesc" readonly></textarea>

            <div class="form-row">
                <div class="form-group">
                    <label>Due Date:</label>
                    <input type="date" id="viewTodoDueDate" readonly>
                </div>
                <div class="form-group">
                    <label>Type:</label>
                    <select id="viewTodoType" disabled>
                        {% for t in todo_types %}
                            <option value="{{ t.id }}">{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="modal-actions">
                <button id="editTodoBtn" class="edit-btn">Edit</button>
                <button id="deleteTodoBtn" class="delete-btn">Delete</button>
                <button id="saveTodoBtn" class="save-btn" style="display:none;">Save</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

        // ----------------------
        // Calendar Setup
        // ----------------------
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            height: '600px',
            initialView: 'dayGridMonth',
            events: '/get-todos-json/',
            dateClick: info => openAddTodoModal(info.dateStr),
           eventClick: function(info) {
                info.jsEvent.preventDefault();
                const todoId = info.event.id;

                fetch(`/get-todo-json/${todoId}/`)
                    .then(res => res.json())
                    .then(todo => {
                        openViewTodoModal(todo);
                    })
                    .catch(err => console.error('Failed to load todo details:', err));
            }


        });
        calendar.render();

        // ----------------------
        // Sidebar Refresh
        // ----------------------
        function refreshSidebar() {
            fetch('/sidebar-partial/')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('sidebar-container').innerHTML = data.html;
                    rebindTodoCardClickHandlers();
                })
                .catch(err => console.error('Sidebar refresh failed', err));
        }

        // ----------------------
        // Modal Helpers
        // ----------------------
        const addModal = document.getElementById('todoModal');
        const viewModal = document.getElementById('viewTodoModal');

        function openAddTodoModal(dateStr) {
            addModal.style.display = 'flex';
            const saveBtn = document.getElementById('saveTodo');
            saveBtn.onclick = null; // remove old handler

            saveBtn.onclick = function() {
                fetch('/add-todo-from-calendar/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        title: document.getElementById('todoTitle').value,
                        description: document.getElementById('todoDesc').value,
                        todo_type: document.getElementById('todoType').value,
                        due_date: dateStr
                    })
                })
                .then(res => res.json())
                .then(() => {
                    addModal.style.display = 'none';
                    calendar.refetchEvents();
                    refreshSidebar();
                })
                .catch(err => console.error(err));
            };
        }

        document.getElementById('closeModal').onclick = () => addModal.style.display = 'none';

        // ----------------------
        // View/Edit/Delete Modal
        // ----------------------
        let currentTodoId = null;

        function openViewTodoModal(todo) {
            currentTodoId = todo.id;

            document.getElementById('viewTodoTitle').value = todo.title;
            document.getElementById('viewTodoDesc').value = todo.description;
            document.getElementById('viewTodoDueDate').value = todo.due_date;
            document.getElementById('viewTodoType').value = todo.todo_type;

            setViewFieldsReadonly(true);
            document.getElementById('saveTodoBtn').style.display = 'none';
            document.getElementById('editTodoBtn').style.display = 'inline-block';

            document.getElementById('viewTodoModal').style.display = 'flex';
        }

        document.getElementById('closeViewModal').onclick = () => viewModal.style.display = 'none';

        document.getElementById('editTodoBtn').onclick = () => {
            setViewFieldsReadonly(false);
            document.getElementById('saveTodoBtn').style.display = 'inline-block';
            document.getElementById('editTodoBtn').style.display = 'none';
        };

        document.getElementById('saveTodoBtn').onclick = () => {
            const payload = {
                title: document.getElementById('viewTodoTitle').value,
                description: document.getElementById('viewTodoDesc').value,
                due_date: document.getElementById('viewTodoDueDate').value,
                todo_type: document.getElementById('viewTodoType').value
            };
            fetch(`/update-todo/${currentTodoId}/`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(payload)
            }).then(() => {
                viewModal.style.display = 'none';
                calendar.refetchEvents();
                refreshSidebar();
            });
        };

        document.getElementById('deleteTodoBtn').onclick = () => {
            if (!confirm('Are you sure you want to delete this todo?')) return;
            fetch(`/delete-todo/${currentTodoId}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            }).then(() => {
                viewModal.style.display = 'none';
                calendar.refetchEvents();
                refreshSidebar();
            });
        };

        function setViewFieldsReadonly(readonly) {
            document.getElementById('viewTodoTitle').readOnly = readonly;
            document.getElementById('viewTodoDesc').readOnly = readonly;
            document.getElementById('viewTodoDueDate').readOnly = readonly;
            document.getElementById('viewTodoType').disabled = readonly;
        }

        // ----------------------
        // Sidebar Todo Cards
        // ----------------------
        document.querySelectorAll('.todo-card').forEach(card => {
            card.addEventListener('mousedown', e => e.preventDefault());
        });

        function rebindTodoCardClickHandlers() {
            document.querySelectorAll('.todo-card').forEach(card => {
                card.onclick = () => {
                if(!card.dataset.id) return
                    const todo = {
                        id: card.dataset.id,
                        title: card.dataset.title,
                        description: card.dataset.desc,
                        due_date: card.dataset.date,
                        todo_type: card.dataset.type
                    };
                    openViewTodoModal(todo);
                };
            });
        }

        // Initial binding
        rebindTodoCardClickHandlers();

        // Optional: close modals on clicking outside
        [addModal, viewModal].forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });

    });
    </script>
</body>
</html>
