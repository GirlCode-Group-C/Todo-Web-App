{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Multi-purpose To do</title>
    <link rel="stylesheet" type="text/css" href="{% static 'todo/landing.css' %}">
</head>
<body>
    <div class="container">
        <h1>Welcome to Multi-purpose To do</h1>
        
        <div class="category-options">
            <div class="checkbox-group">
                <input type="checkbox" id="personal" name="category" value="personal">
                <label for="personal">Personal To do</label>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="school" name="category" value="school">
                <label for="school">School To do</label>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="work" name="category" value="work">
                <label for="work">Work To do</label>
            </div>
        </div>
        
        <div class="button-group">
            <button type="button" class="btn-continue">Continue</button>
            <button type="button" class="btn-skip">Skip to Home</button>
        </div>
    </div>
</body>
</html>
