<div class="todo-card"
     style="border-left: 6px solid {{ color }};"
     data-id="{{ id }}"
     data-title="{{ title }}"
     data-desc="{{ description }}"
     data-date="{{ date|date:'Y-m-d' }}"
     data-type="{{ type }}">
    <strong>{{ title }}</strong>
    <p>{{ category_name }}</p>
</div>
